name: Release

# Запускается при отправке тега вида v1.2.0.
# Собирает установщик и portable, создаёт GitHub Release
# с постоянными именами файлов, на которые ссылается сайт.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Код
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Проверить, что тег совпадает с версией
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Тег ${{ github.ref_name }} не совпадает с версией в package.json (v$version). Поднимите версию и создайте тег заново."
          }
          Write-Host "Версия $version — ок"

      - name: Зависимости
        run: npm ci

      # GitHub Releases иногда отдаёт 504 при скачивании бинарников
      # electron-builder (winCodeSign, NSIS). Зеркало npmmirror решает это,
      # а retry даёт запас на краткие сбои сети.
      - name: Собрать EXE
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        run: |
          $ok = $false
          foreach ($i in 1..3) {
            Write-Host "Попытка сборки $i из 3"
            npm run dist:win
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "Сборка не удалась, пауза 20 секунд..."
            Start-Sleep -Seconds 20
          }
          if (-not $ok) { throw "Сборка EXE не удалась после 3 попыток" }

      - name: Подготовить файлы релиза
        run: npm run release:assets

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          name: VOID ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
# Релиз публикует softprops/action-gh-release; latest.yml нужен
# electron-updater для автообновления, поэтому добавлен в files.
# latest.yml ссылается на версионированные имена (VOID-Setup-1.3.0.exe),
# поэтому публикуем и их рядом с постоянными.
          files: |
            release/VOID-Setup.exe
            release/VOID-Portable.exe
            release/SHA256SUMS.txt
            dist/latest.yml
            dist/VOID-Setup-*.exe
            dist/VOID-Portable-*.exe
